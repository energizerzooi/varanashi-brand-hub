<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varanashi Photo Grader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Hind+Mysuru:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:light;
  --limewash:#F9E6D6; --limewash-l2:#FBF2E9; --panel:#FBEDDF;
  --sunbreak:#E47444; --sunbreak-deep:#AC492B; --slate:#2C3D52; --soft:#445C75;
  --warm-line:rgba(172,73,43,.22); --rule:rgba(44,61,82,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--limewash);color:var(--slate);font-family:"Hind Mysuru",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:20px clamp(20px,3vw,32px) 28px}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

/* ---------- uploader (inline, inside the hub card) ---------- */
.uploader{border:1.5px dashed var(--warm-line);border-radius:18px;padding:32px 20px;text-align:center;background:var(--limewash-l2);transition:background .2s,border-color .2s;cursor:pointer}
.uploader:hover{background:var(--panel)}
.uploader.drag-over{border-color:var(--sunbreak);background:var(--panel)}
.upload-label{display:block;font-size:17px;font-weight:500;margin-bottom:4px}
.upload-hint{font-size:14px;color:var(--soft);margin:0 0 18px}
input[type=file]{display:none}
.uploader.loading{opacity:.6;pointer-events:none}
.uploader .err{color:var(--sunbreak-deep);font-size:14px;margin:12px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:11px 20px 8px;border-radius:999px;border:1px solid transparent;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.btn.solid{background:var(--sunbreak-deep);color:var(--limewash-l2);box-shadow:0 4px 10px -6px rgba(172,73,43,.24)}
.btn.solid:hover{background:#9b4026}
.btn.ghost{background:transparent;border-color:var(--warm-line);color:var(--slate)}
.btn.ghost:hover{border-color:var(--sunbreak-deep);color:var(--sunbreak-deep)}
.btn:disabled{opacity:.55;cursor:progress}
.btn:focus-visible{outline:3px solid rgba(228,116,68,.45);outline-offset:2px}

/* ---------- the grading window ---------- */
html.modal-open,html.modal-open body{background:transparent;overflow:hidden}
html.modal-open .inline{display:none}
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,40,54,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:relative;width:min(1180px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--limewash);border-radius:24px;box-shadow:0 12px 32px -16px rgba(58,28,12,.25);padding:22px clamp(18px,2.4vw,30px) 22px;display:grid;gap:18px;overscroll-behavior:contain}
.sheet:focus{outline:none}
.sheet-head{display:flex;align-items:center;gap:14px}
.sheet-head h2{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:26px;line-height:1.1;margin:0}
.sheet-head .fname{color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.close{all:unset;box-sizing:border-box;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--warm-line);color:var(--slate)}
.close:hover{border-color:var(--sunbreak-deep);color:var(--sunbreak-deep)}
.close:focus-visible{outline:3px solid rgba(228,116,68,.45);outline-offset:2px}
.close svg{width:16px;height:16px}


.views{display:grid;grid-template-columns:1fr;gap:14px}
.views figure{margin:0;display:grid;gap:8px;min-width:0}
.views .frame{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);display:flex;align-items:center;justify-content:center;height:min(58vh,620px);cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.views .frame.holding{cursor:grabbing}
.views canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
.views figcaption{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;gap:8px}
.views figcaption .hint{font-weight:400;letter-spacing:0;text-transform:none;font-size:13px}
.busy{position:absolute;right:12px;top:12px;width:18px;height:18px;border-radius:50%;border:2px solid rgba(251,242,233,.6);border-top-color:var(--sunbreak);animation:spin .8s linear infinite;opacity:0;transition:opacity .15s}
.busy.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* sliders */
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 26px;padding:4px 2px}
.ctl{display:grid;gap:6px;min-width:0}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-size:15px;font-weight:500}
.ctl output{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.ctl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,transparent calc(var(--d) - 1px),rgba(44,61,82,.45) calc(var(--d) - 1px),rgba(44,61,82,.45) calc(var(--d) + 1px),transparent calc(var(--d) + 1px)),linear-gradient(90deg,var(--sunbreak) var(--p),rgba(172,73,43,.18) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,transparent calc(var(--d) - 1px),rgba(44,61,82,.45) calc(var(--d) - 1px),rgba(44,61,82,.45) calc(var(--d) + 1px),transparent calc(var(--d) + 1px)),linear-gradient(90deg,var(--sunbreak) var(--p),rgba(172,73,43,.18) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--limewash-l2);border:2px solid var(--sunbreak-deep);box-shadow:0 1px 3px rgba(44,61,82,.18)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--limewash-l2);border:2px solid var(--sunbreak-deep);box-shadow:0 1px 3px rgba(44,61,82,.18)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(228,116,68,.3)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px rgba(228,116,68,.3)}

.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--rule)}
.sheet-foot .note{color:var(--soft);font-size:13px;flex:1;min-width:200px}
.sheet-foot .acts{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}

@media (max-width:980px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){
  .modal{padding:0}
  .sheet{border-radius:0;max-height:100vh;max-height:100dvh;height:100%;padding:16px 16px 20px;align-content:start}
  .sheet-head h2{font-size:22px}
  .views .frame{height:auto;border-radius:10px}
  .views canvas{width:100%;height:auto;max-height:46vh;object-fit:contain}
  .views figcaption{flex-direction:column;gap:2px}
  .controls{grid-template-columns:1fr;gap:12px}
  .sheet-foot .acts{width:100%}
  .sheet-foot .acts .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="inline">
  <div class="uploader" id="uploader" role="button" tabindex="0" aria-label="Choose a photo to grade">
    <span class="upload-label">Choose a photo or drag it here</span>
    <p class="upload-hint">JPEG or PNG. It opens in a grading window where you can fine-tune the look.</p>
    <span class="btn solid" aria-hidden="true">Select photo</span>
    <p class="err" id="uploadErr" hidden></p>
    <input type="file" id="fileInput" accept="image/jpeg,image/png">
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" tabindex="-1">
    <div class="sheet-head">
      <h2 id="mTitle">Grade your photo</h2>
      <span class="fname" id="fname"></span>
      <button class="close" id="closeBtn" aria-label="Close the grading window"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
    </div>

    <div class="views" id="views">
      <canvas id="cvOrig" hidden></canvas>
      <figure class="graded"><figcaption><span id="viewLabel">Graded</span><span class="hint">Press and hold the photo to see the original</span></figcaption><div class="frame" id="gradedFrame"><canvas id="cvGraded"></canvas><span class="busy" id="busy"></span></div></figure>
    </div>

    <div class="controls" id="controls"></div>

    <div class="sheet-foot">
      <span class="note" id="note">Every slider starts at the house grade. Double-click a slider to reset it.</span>
      <div class="acts">
        <button class="btn ghost" id="resetBtn" type="button">Reset to house grade</button>
        <button class="btn ghost" id="anotherBtn" type="button">Another photo</button>
        <button class="btn solid" id="downloadBtn" type="button">Download</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   The Varanashi grade (OKLab), with eight bounded controls.
   Every control's default reproduces the house grade exactly:
   warmth 1.8 · drama 1.6 · green/earth tension 1.6 · grain ±0.01.
   Ranges are capped so no setting can push a photo off-brand.
   ============================================================ */
const CONTROLS = [
  { id:"strength",  label:"Strength",   min:0,    max:100, def:100, fmt:v => v + "%" },
  { id:"exposure",  label:"Exposure",   min:-100, max:100, def:0,   fmt:v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v/100).toFixed(1) + " EV" },
  { id:"warmth",    label:"Warmth",     min:-40,  max:25,  def:0,   fmt:signed },
  { id:"contrast",  label:"Contrast",   min:-40,  max:25,  def:0,   fmt:signed },
  { id:"saturation",label:"Saturation", min:-30,  max:15,  def:0,   fmt:signed },
  { id:"balance",   label:"Forest ↔ Earth", min:-100, max:100, def:0, fmt:v => v === 0 ? "Centre" : (v < 0 ? "Forest " : "Earth ") + Math.abs(v), ends:["Forest","Earth"] },
  { id:"fade",      label:"Fade",       min:0,    max:100, def:25,  fmt:v => String(v) },
  { id:"grain",     label:"Grain",      min:0,    max:100, def:25,  fmt:v => String(v) }
];
function signed(v){ return v === 0 ? "0" : (v > 0 ? "+" : "−") + Math.abs(v) + "%"; }
const P = {}; CONTROLS.forEach(c => P[c.id] = c.def);

/* ---------- colour maths ---------- */
const S2L = new Float32Array(256);
for(let i = 0; i < 256; i++){ const c = i / 255; S2L[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function l2s(c){ return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
const D2R = Math.PI / 180;
function hd(a, b){ return ((b - a + 540) % 360) - 180; }
function pull(H, C, center, width, target, amt){
  const d = hd(H, center) / width, w = Math.exp(-0.5 * d * d) * Math.min(1, C / 0.04);
  return (H + hd(H, target) * w * amt + 360) % 360;
}
function curve(x, ys){ /* the house 5-point filmic curve, piecewise linear */
  const xs = [0, .15, .5, .85, 1];
  if(x <= 0) return ys[0]; if(x >= 1) return ys[4];
  for(let i = 0; i < 4; i++) if(x <= xs[i+1]) { const t = (x - xs[i]) / (xs[i+1] - xs[i]); return ys[i] + (ys[i+1] - ys[i]) * t; }
  return ys[4];
}
/* film grain: hashed value noise tied to position, sized relative to the photo so the
   preview and the full-size download carry the same grain */
function hash(x, y){ let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16; return (n & 0xffff) / 32767.5 - 1; }
function grainAt(x, y, cell){
  if(cell <= 1) return hash(x, y);
  const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
  const a = hash(x0, y0), b = hash(x0 + 1, y0), c = hash(x0, y0 + 1), d = hash(x0 + 1, y0 + 1);
  return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
}

/* auto-balance: levels measured once (on the preview) and applied identically at every size */
function measureLevels(data){
  const hist = new Uint32Array(256), n = data.length / 4;
  for(let i = 0; i < data.length; i += 4) hist[Math.round(data[i] * .299 + data[i+1] * .587 + data[i+2] * .114)]++;
  let lo = 0, hi = 255, acc = 0, gotLo = false;
  for(let i = 0; i < 256; i++){ acc += hist[i]; if(!gotLo && acc >= n * .02){ lo = i; gotLo = true; } if(acc >= n * .98){ hi = i; break; } }
  if(hi - lo < 50){ lo = Math.max(0, lo - 10); hi = Math.min(255, hi + 10); }
  return { lo, hi };
}
function applyLevels(data, L){
  const k = 255 / Math.max(1, L.hi - L.lo);
  for(let i = 0; i < data.length; i += 4){
    let r = Math.max(0, Math.min(255, (data[i] - L.lo) * k)), g = Math.max(0, Math.min(255, (data[i+1] - L.lo) * k)), b = Math.max(0, Math.min(255, (data[i+2] - L.lo) * k));
    const m = Math.max(r, g, b);
    if(m > 150){ if(r === m) r *= .97; else if(g === m) g *= .97; else b *= .97; }
    data[i] = r; data[i+1] = g; data[i+2] = b;
  }
}

/* the grade itself; rows [y0, y1) of a w-wide buffer, in place; long = the photo's long edge in px */
function gradeRows(data, w, y0, y1, long, p){
  const warmth = 1.8 * (1 + p.warmth / 100), drama = 1.6 * (1 + p.contrast / 100), tension = 1.6 - 0.4 * p.balance / 100;
  const sat = 1 + p.saturation / 100, expo = Math.pow(2, p.exposure / 100), mix = p.strength / 100;
  const fadeK = p.fade <= 25 ? p.fade / 25 : 1 + (p.fade - 25) / 75;
  const toe = (0.075 + (drama - 1) * 0.015) * fadeK, shoulder = 0.955 - (drama - 1) * 0.045;
  const ys = [toe, 0.17, 0.50, 0.84, shoulder];
  const greenPull = 0.45 * (0.7 + 0.3 * tension), orangePull = 0.5 * (1.3 - 0.3 * tension);
  const wsF = 0.022, whF = 0.034 * warmth, under = (warmth - 1) * 0.008;
  const csA = Math.cos(250 * D2R), snA = Math.sin(250 * D2R), chA = Math.cos(74 * D2R), shA = Math.sin(74 * D2R);
  const gAmp = p.grain / 100 * 0.04, cell = Math.max(1, long / 1800);
  for(let y = y0; y < y1; y++){
    for(let x = 0, i = y * w * 4; x < w; x++, i += 4){
      let lr = S2L[data[i]] * expo, lg = S2L[data[i+1]] * expo, lb = S2L[data[i+2]] * expo;
      if(lr > 1) lr = 1; if(lg > 1) lg = 1; if(lb > 1) lb = 1;
      const l_ = Math.cbrt(.4122214708 * lr + .5363325363 * lg + .0514459929 * lb);
      const m_ = Math.cbrt(.2119034982 * lr + .6806995451 * lg + .1073969566 * lb);
      const s_ = Math.cbrt(.0883024619 * lr + .2817188376 * lg + .6299787005 * lb);
      const L = .2104542553 * l_ + .7936177850 * m_ - .0040720468 * s_;
      const A = 1.9779984951 * l_ - 2.4285922050 * m_ + .4505937099 * s_;
      const Bb = .0259040371 * l_ + .7827717662 * m_ - .8086757660 * s_;
      let C = Math.hypot(A, Bb), H = (Math.atan2(Bb, A) / D2R + 360) % 360;
      let Lc = curve(L < 0 ? 0 : L > 1 ? 1 : L, ys);
      H = pull(H, C, 135, 32, 150, greenPull);
      H = pull(H, C, 45, 25, 54, orangePull);
      const dg = hd(H, 150) / 30, dO = hd(H, 54) / 22;
      const gm = Math.exp(-0.5 * dg * dg), om = Math.exp(-0.5 * dO * dO) * Math.min(1, C / 0.03);
      C = C * (0.74 - 0.22 * Math.abs(Lc - 0.55) / 0.45 + 0.12 * gm + 0.20 * om) * sat;
      Lc = Lc - (0.55 - 0.25 * om) * C * Math.min(1, Lc / 0.3);
      const ws = Math.pow(Math.min(1, Math.max(0, 1 - Lc / 0.45)), 1.4);
      const wh = Math.pow(Math.min(1, Math.max(0, (Lc - 0.65) / 0.35)), 1.2);
      const a = C * Math.cos(H * D2R) + wsF * csA * ws + whF * chA * wh + under;
      const b = C * Math.sin(H * D2R) + wsF * snA * ws + whF * shA * wh;
      if(gAmp > 0){ const lw = 0.35 + 2.6 * Lc * (1 - Lc); Lc += gAmp * lw * grainAt(x, y, cell); }
      if(Lc < 0) Lc = 0; else if(Lc > 1) Lc = 1;
      const l3 = Lc + .3963377774 * a + .2158037573 * b, m3 = Lc - .1055613458 * a - .0638541728 * b, s3 = Lc - .0894841775 * a - 1.2914855480 * b;
      const l = l3 * l3 * l3, m = m3 * m3 * m3, s = s3 * s3 * s3;
      let R = l2s(Math.max(0, 4.0767416621 * l - 3.3077115913 * m + .2309699292 * s)) * 255;
      let G = l2s(Math.max(0, -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s)) * 255;
      let Bo = l2s(Math.max(0, -.0041960863 * l - .7034186147 * m + 1.7076147010 * s)) * 255;
      if(mix < 1){
        const r0 = l2s(lr) * 255, g0 = l2s(lg) * 255, b0 = l2s(lb) * 255;
        R = r0 + (R - r0) * mix; G = g0 + (G - g0) * mix; Bo = b0 + (Bo - b0) * mix;
      }
      data[i] = R; data[i+1] = G; data[i+2] = Bo;
    }
  }
}

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const html = document.documentElement, embedded = window.parent !== window;
let img = null, sourceName = "photo", levels = null;
let prev = null, draft = null; /* {w,h,base:Uint8ClampedArray, canvas} */
const PREVIEW_MAX = 1200, DRAFT_MAX = 640;

function buildControls(){
  $("#controls").innerHTML = CONTROLS.map(c => {
    const d = (c.def - c.min) / (c.max - c.min) * 100;
    return `<div class="ctl"><div class="ctl-top"><label for="s-${c.id}">${c.label}</label><output id="o-${c.id}" for="s-${c.id}">${c.fmt(c.def)}</output></div>
      <input type="range" id="s-${c.id}" data-id="${c.id}" min="${c.min}" max="${c.max}" step="1" value="${c.def}" style="--d:${d}%;--p:${d}%" aria-describedby="o-${c.id}">
      ${c.ends ? `<div class="ends"><span>${c.ends[0]}</span><span>${c.ends[1]}</span></div>` : ""}</div>`;
  }).join("");
  $("#controls").addEventListener("input", e => { const s = e.target.closest("input[type=range]"); if(!s) return; setVal(s.dataset.id, +s.value, false); schedule(true); });
  $("#controls").addEventListener("change", e => { if(e.target.matches("input[type=range]")) schedule(false); });
  $("#controls").addEventListener("dblclick", e => { const s = e.target.closest("input[type=range]"); if(!s) return; const c = CONTROLS.find(x => x.id === s.dataset.id); setVal(c.id, c.def, true); schedule(false); });
}
function setVal(id, v, moveSlider){
  const c = CONTROLS.find(x => x.id === id), s = $("#s-" + id);
  P[id] = v; if(moveSlider) s.value = v;
  s.style.setProperty("--p", ((v - c.min) / (c.max - c.min) * 100) + "%");
  $("#o-" + id).textContent = c.fmt(v);
}
function resetAll(){ CONTROLS.forEach(c => setVal(c.id, c.def, true)); schedule(false); }

/* ---------- rendering: a small draft while dragging, the full preview on release ---------- */
function makeLevel(maxEdge){
  const k = Math.min(1, maxEdge / Math.max(img.w, img.h));
  const w = Math.max(1, Math.round(img.w * k)), h = Math.max(1, Math.round(img.h * k));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(img.src, 0, 0, w, h);
  const id = cx.getImageData(0, 0, w, h);
  return { w, h, cv, cx, raw: new Uint8ClampedArray(id.data), id };
}
let pending = null, raf = 0, timer = 0;
function schedule(isDraft){
  pending = isDraft ? "draft" : "full";
  if(isDraft){ if(!raf) raf = requestAnimationFrame(run); }
  else { cancelAnimationFrame(raf); raf = 0; clearTimeout(timer); $("#busy").classList.add("on"); timer = setTimeout(run, 30); }
}
function run(){
  raf = 0; const mode = pending; pending = null; if(!prev) return;
  const lv = mode === "draft" ? draft : prev;
  lv.id.data.set(lv.base);
  gradeRows(lv.id.data, lv.w, 0, lv.h, Math.max(lv.w, lv.h), P);
  lv.cx.putImageData(lv.id, 0, 0);
  const g = $("#cvGraded"), gx = g.getContext("2d");
  gx.imageSmoothingQuality = "high"; gx.drawImage(lv.cv, 0, 0, g.width, g.height);
  if(mode === "full") $("#busy").classList.remove("on");
}

/* ---------- open / close ---------- */
function openModal(){
  html.classList.add("modal-open"); $("#modal").hidden = false;
  if(embedded) window.parent.postMessage({ varanashiGraderModal: true }, "*");
  setTimeout(() => $(".sheet").focus(), 0);
}
function closeModal(){
  $("#modal").hidden = true; html.classList.remove("modal-open");
  if(embedded) window.parent.postMessage({ varanashiGraderModal: false }, "*");
  img = prev = draft = levels = null; $("#fileInput").value = "";
  reportHeight(); $("#uploader").focus();
}

function handleFile(file){
  const err = $("#uploadErr"); err.hidden = true;
  if(!file || !/^image\/(jpeg|png)$/.test(file.type)){ err.textContent = "Please choose a JPEG or PNG photo."; err.hidden = false; reportHeight(); return; }
  sourceName = (file.name || "photo").replace(/\.[^.]+$/, "").replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "photo";
  const ticket = ++loadTicket;
  const fail = msg => { if(ticket !== loadTicket) return; err.textContent = msg; err.hidden = false; $("#uploader").classList.remove("loading"); reportHeight(); };
  $("#uploader").classList.add("loading");
  const timeout = setTimeout(() => { fail("That photo is taking too long to open. Try a smaller JPEG."); loadTicket++; }, 20000);
  decodePhoto(file).then(decoded => {
    clearTimeout(timeout); if(ticket !== loadTicket) return;
    $("#uploader").classList.remove("loading");
    img = decoded;
    prev = makeLevel(PREVIEW_MAX); draft = makeLevel(DRAFT_MAX);
    levels = measureLevels(prev.raw);
    [prev, draft].forEach(lv => { lv.base = new Uint8ClampedArray(lv.raw); applyLevels(lv.base, levels); });
    const o = $("#cvOrig"), g = $("#cvGraded");
    o.width = g.width = prev.w; o.height = g.height = prev.h;
    o.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(prev.raw), prev.w, prev.h), 0, 0);
    $("#fname").textContent = file.name || "";
    resetAll(); openModal();
  }).catch(() => { clearTimeout(timeout); fail("That file could not be opened. Try a different photo."); });
}
/* Decode the photo straight from the file (respects phone camera orientation). The fallback keeps a
   firm reference to the loading image so the browser cannot discard it before it finishes. */
let loadTicket = 0, loadingImg = null;
async function decodePhoto(file){
  if(window.createImageBitmap){
    try { const bm = await createImageBitmap(file, { imageOrientation: "from-image" }); return { src: bm, w: bm.width, h: bm.height }; } catch(e){}
  }
  const url = URL.createObjectURL(file), im = new Image(); loadingImg = im;
  try {
    await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = url; });
    return { src: im, w: im.naturalWidth, h: im.naturalHeight };
  } finally { loadingImg = null; }
}

/* ---------- full-size download, in slices so the page stays responsive ---------- */
async function download(){
  if(!img) return;
  const btn = $("#downloadBtn"), label = btn.textContent; btn.disabled = true;
  try {
    const MAX_PX = 16000000, W0 = img.w, H0 = img.h, k = Math.min(1, Math.sqrt(MAX_PX / (W0 * H0)));
    const w = Math.floor(W0 * k), h = Math.floor(H0 * k);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(img.src, 0, 0, w, h);
    const id = cx.getImageData(0, 0, w, h);
    applyLevels(id.data, levels);
    const snap = Object.assign({}, P), step = Math.max(16, Math.floor(400000 / w));
    for(let y = 0; y < h; y += step){
      gradeRows(id.data, w, y, Math.min(h, y + step), Math.max(w, h), snap);
      btn.textContent = "Preparing " + Math.round(Math.min(1, (y + step) / h) * 100) + "%";
      await new Promise(r => setTimeout(r, 0));
    }
    cx.putImageData(id, 0, 0);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.95));
    if(!blob) throw new Error("blob");
    const filename = sourceName + "-varanashi-graded.jpg";
    if(embedded) window.parent.postMessage({ varanashiGraderSave: { filename, blob } }, "*");
    else { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
    $("#note").textContent = "Downloaded " + filename + ".";
  } catch(e){
    $("#note").textContent = "Could not prepare the download. Try a smaller photo.";
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* ---------- wiring ---------- */
function wire(){
  const up = $("#uploader"), input = $("#fileInput");
  up.addEventListener("click", () => input.click());
  up.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); input.click(); } });
  up.addEventListener("dragover", e => { e.preventDefault(); up.classList.add("drag-over"); });
  up.addEventListener("dragleave", () => up.classList.remove("drag-over"));
  up.addEventListener("drop", e => { e.preventDefault(); up.classList.remove("drag-over"); if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
  input.addEventListener("change", () => { if(input.files.length) handleFile(input.files[0]); });
  $("#closeBtn").addEventListener("click", closeModal);
  $("#anotherBtn").addEventListener("click", () => input.click());
  $("#resetBtn").addEventListener("click", resetAll);
  $("#downloadBtn").addEventListener("click", download);
  $("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#modal").hidden) closeModal(); });
  /* press and hold the photo (or hold the space bar on it) to see the original in place */
  const gf = $("#gradedFrame"); let holding = false;
  gf.tabIndex = 0; gf.setAttribute("aria-label", "Graded photo. Press and hold to see the original.");
  const show = on => { if(!prev || on === holding) return; holding = on; gf.classList.toggle("holding", on);
    const g = $("#cvGraded"); g.getContext("2d").drawImage(on ? $("#cvOrig") : prev.cv, 0, 0, g.width, g.height);
    $("#viewLabel").textContent = on ? "Original" : "Graded"; };
  gf.addEventListener("pointerdown", e => { e.preventDefault(); show(true); });
  ["pointerup","pointerleave","pointercancel"].forEach(t => gf.addEventListener(t, () => show(false)));
  gf.addEventListener("contextmenu", e => e.preventDefault());
  gf.addEventListener("keydown", e => { if(e.key === " "){ e.preventDefault(); show(true); } });
  gf.addEventListener("keyup", e => { if(e.key === " ") show(false); });
}

/* the hub sizes this frame to fit while it is inline */
function reportHeight(){
  if(!embedded || html.classList.contains("modal-open")) return;
  window.parent.postMessage({ varanashiGraderHeight: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
}
buildControls(); wire();
if(window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body); else setInterval(reportHeight, 500);
reportHeight();
</script>
</body>
