        <style>
            :root{--slate:#2C3D52;--limewash:#F9E6D6;--sunbreak:#E47444;--sunbreak-deep:#AC492B;--cream:#FBF2E9;--warm-line:rgba(172,73,43,.22)}
            *{box-sizing:border-box}
            html,body{margin:0;min-height:100%}
            body.staticrypt-body{min-height:100svh;background:var(--slate);color:var(--slate);font-family:"Hind Mysuru",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
            .hidden{display:none!important}
            .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
            .bg{position:fixed;inset:0;z-index:0;background:var(--slate) url("images/hero-river.jpg") center/cover no-repeat}
            .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(44,61,82,.30),rgba(44,61,82,.20) 40%,rgba(30,40,54,.70))}
            @media (prefers-reduced-motion:no-preference){.bg{animation:drift 30s ease-in-out infinite alternate}@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08)}}}
            .staticrypt-spinner-container,.staticrypt-content{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
            .staticrypt-spinner{width:28px;height:28px;border:3px solid rgba(251,242,233,.35);border-top-color:var(--cream);border-radius:50%;animation:spin 1s linear infinite}
            @keyframes spin{to{transform:rotate(360deg)}}
            .stack{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:32px}
            .card{width:100%;background:var(--limewash);border-radius:24px;padding:40px 32px 32px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 30px 70px -24px rgba(58,28,12,.55)}
            .lockup{display:block;width:190px;height:auto;filter:drop-shadow(0 2px 10px rgba(20,28,40,.45))}
            h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:0 0 10px;text-align:center}
            .lede{font-size:15px;line-height:1.55;margin:0 auto 28px;max-width:30ch;text-align:center;color:rgba(44,61,82,.82)}
            .staticrypt-password-container{position:relative}
            #staticrypt-password{width:100%;font:inherit;font-size:16px;color:var(--slate);background:var(--cream);border:1px solid var(--warm-line);border-radius:14px;padding:14px 48px 12px 18px;outline:none;transition:border-color .2s,box-shadow .2s}
            #staticrypt-password::placeholder{color:rgba(44,61,82,.5)}
            #staticrypt-password:focus{border-color:rgba(228,116,68,.7);box-shadow:0 0 0 4px rgba(228,116,68,.18)}
            .staticrypt-toggle-password-visibility{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:.4;cursor:pointer}
            .err{font-size:14px;color:var(--sunbreak-deep);margin:10px 4px 0;text-align:center}
            .staticrypt-remember{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;margin:18px 0 22px;cursor:pointer;color:rgba(44,61,82,.85)}
            .staticrypt-remember input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid rgba(172,73,43,.45);border-radius:6px;background:var(--cream);display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
            .staticrypt-remember input::after{content:"";width:9px;height:5px;border:2px solid var(--cream);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
            .staticrypt-remember input:checked{background:var(--sunbreak-deep);border-color:var(--sunbreak-deep)}
            .staticrypt-remember input:checked::after{opacity:1}
            .staticrypt-remember input:focus-visible{outline:3px solid rgba(228,116,68,.4);outline-offset:2px}
            .staticrypt-decrypt-button{width:100%;font:inherit;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);background:var(--sunbreak-deep);border:0;border-radius:999px;padding:15px 20px 13px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(172,73,43,.8);transition:background .2s,transform .2s}
            .staticrypt-decrypt-button:hover{background:#9b4026;transform:translateY(-1px)}
            .staticrypt-decrypt-button:focus-visible{outline:3px solid rgba(228,116,68,.5);outline-offset:3px}
            @media (max-width:420px){.card{padding:34px 22px 26px;border-radius:20px}h1{font-size:26px}.lockup{width:170px}}
        </style>
    </head>
